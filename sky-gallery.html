<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Orbit - sky gallery</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{min-height:100vh;background:#06070d;font-family:"Segoe UI",system-ui,sans-serif;color:#e8e6ef;
      display:flex;align-items:center;justify-content:center;padding:20px;gap:18px}
 #stage{position:relative;width:1280px;height:720px;border-radius:10px;overflow:hidden;background:#000;
        box-shadow:0 30px 110px rgba(0,0,0,.9);flex:0 0 auto}
 #sky{position:absolute;inset:0;background-size:cover;background-position:center}
 #scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,6,14,.9) 0%,rgba(4,6,14,.82) 16%,
    rgba(4,6,14,.6) 36%,rgba(4,6,14,.3) 58%,rgba(4,6,14,.08) 78%,rgba(4,6,14,0) 100%);transition:.25s}
 #vig{position:absolute;inset:0;background:radial-gradient(130% 100% at 55% 45%,rgba(0,0,0,0) 40%,
    rgba(0,0,0,.4) 85%,rgba(0,0,0,.62) 100%)}
 /* title-screen content */
 #title{position:absolute;inset:0}
 .wordmark{position:absolute;font-weight:800;letter-spacing:.02em;color:#fff;line-height:1}
 .tagline{position:absolute;color:rgba(255,255,255,.45);font-weight:600}
 /* in-game mock */
 #game{position:absolute;inset:0;display:none}
 #horizon{position:absolute;left:0;right:0;bottom:0;height:34%;
   background:linear-gradient(180deg,#6f9a55,#55743f 60%,#3f5730)}
 #hb{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:3px}
 .slot{width:34px;height:34px;border:1.5px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);border-radius:3px;
   display:flex;align-items:center;justify-content:center;font-size:11px;color:#cfd6e6}
 .slot.sel{border-color:#fff;background:rgba(0,0,0,.7)}
 #xp{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:520px;height:4px;background:rgba(0,0,0,.5);border-radius:2px}
 #xp i{display:block;height:100%;width:62%;background:#7ee09a;border-radius:2px}
 #cross{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);opacity:.85}
 #cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.9)}
 #cross:before{left:7px;top:0;width:2px;height:16px}
 #cross:after{top:7px;left:0;height:2px;width:16px}
 #espbox{position:absolute;width:34px;height:74px;border:1.5px solid #ff5555;left:62%;top:40%;
   box-shadow:0 0 12px rgba(255,85,85,.35)}
 #espbox span{position:absolute;top:-16px;left:-1px;font-size:10px;color:#ff8f8f;white-space:nowrap}
 /* panel */
 #panel{width:340px;flex:0 0 auto;font-size:12px}
 #panel h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7f7b91;margin-bottom:8px;font-weight:700}
 .list{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;max-height:470px;overflow-y:auto;padding-right:4px}
 .card{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:9px;cursor:pointer;
   background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:.13s}
 .card:hover{background:rgba(255,255,255,.08)}
 .card.on{border-color:rgba(127,168,255,.7);background:rgba(127,168,255,.16)}
 .thumb{width:52px;height:30px;border-radius:5px;background-size:cover;background-position:center;flex:0 0 auto}
 .card .t{font-size:11.5px;font-weight:600;color:#fff;line-height:1.25}
 .card .s{font-size:9.5px;color:#8b879c;line-height:1.3}
 .seg{display:flex;gap:5px;margin-bottom:12px}
 .seg button{flex:1;padding:7px 0;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.05);
   border:1px solid rgba(255,255,255,.09);color:#cfcbdd;font-size:11px;font-weight:600}
 .seg button.on{background:rgba(127,168,255,.22);border-color:rgba(127,168,255,.6);color:#fff}
 .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#a9a4bb;font-size:11.5px}
 input[type=range]{-webkit-appearance:none;width:130px;height:4px;border-radius:3px;background:rgba(255,255,255,.14)}
 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff}
 #info{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);color:#6f6b80;font-size:10.5px;line-height:1.65}
 #info b{color:#b9b4c8}
</style></head><body>
<div id="stage">
  <div id="sky"></div>
  <div id="scrim"></div>
  <div id="vig"></div>
  <div id="title"></div>
  <div id="game">
    <div id="horizon"></div>
    <div id="espbox"><span>Zombie 14m</span></div>
    <div id="cross"></div>
    <div id="xp"><i></i></div>
    <div id="hb"></div>
  </div>
</div>

<div id="panel">
  <h4>Context</h4>
  <div class="seg" id="ctx">
    <button data-c="title" class="on">title screen</button>
    <button data-c="game">in game</button>
  </div>
  <h4>Sky</h4>
  <div class="list" id="list"></div>
  <div class="row"><span>scrim strength</span><input type="range" id="scrimS" min="0" max="100" value="70"></div>
  <div id="info"></div>
</div>

       'padding-left:14px;border-radius:8px;font-size:12.5px;font-weight:600;'+
       (sel?'color:#fff;border:1px solid rgba(127,168,255,.4);background:linear-gradient(90deg,rgba(127,168,255,.18),rgba(255,255,255,.035))'
           :'color:rgba(235,235,243,.82);border:1px solid transparent')+'">'+label+'</div>';
    y+=26;
  });
  h+='<div style="position:absolute;left:77px;top:487px;font-size:12px;color:rgba(235,235,243,.8)">Options</div>';
  h+='<div style="position:absolute;left:172px;top:487px;font-size:12px;color:rgba(235,235,243,.8)">Quit</div>';
  h+='<div class="tagline" style="left:77px;top:619px;font-size:9px">Orbit 0.1.0 · Fabric</div>';
  titleEl.innerHTML=h;
}

function render(){
  skyEl.style.backgroundImage='url('+DATA[current]+')';
  document.getElementById('scrim').style.opacity = scrim/100;
  titleEl.style.display = ctx==='title'?'block':'none';
  gameEl.style.display = ctx==='game'?'block':'none';
  const m=META[current];
  document.getElementById('info').innerHTML =
    '<b>'+m.name+'</b> — '+m.note+'<br>'+
    'baked 1280×720 · <b>'+m.mb+' MB</b> in the jar · ~3.5 MB VRAM<br>'+
    'one draw call, no shader';
}

document.querySelectorAll('#ctx button').forEach(b=>b.onclick=()=>{
  ctx=b.dataset.c;
  document.querySelectorAll('#ctx button').forEach(o=>o.classList.toggle('on',o===b));
  render();
});
document.getElementById('scrimS').oninput=e=>{scrim=+e.target.value;render();};

function fit(){document.getElementById('stage').style.transform='scale('+Math.min(1,(window.innerHeight-40)/720)+')';}
addEventListener('resize',fit);
buildList(); buildTitle(); buildHotbar(); fit(); render();
</script></body></html>
