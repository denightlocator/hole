name: Orbit Client · Fabric 1.21.11

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test observation logic and module flow
        run: bash tools/selftest/run-observation-tests.sh
      - name: Test original geometry and local audio
        run: bash tools/selftest/run-original-tests.sh
      - name: Build the combined Fabric client
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build > "$RUNNER_TEMP/orbit-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/orbit-build.log"
          if (( result != 0 )); then
            python3 - "$RUNNER_TEMP/orbit-build.log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          relevant = [line.strip() for line in lines if 'error:' in line.lower()
                      or line.startswith(('FAILURE:', '* What went wrong:', '> '))]
          for line in relevant[-35:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$result"
      - name: Test Orbit configuration persistence
        run: bash tools/selftest/run-config-tests.sh
      - name: Upload the remapped client jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbit-client
          path: |
            build/libs/orbit-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
