<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprout — Interface studies</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#38362f;font:15px system-ui,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}.bar{background:#222622;color:#e6eadf;padding:14px 4vw;display:flex;align-items:center;gap:18px}.mark{font: bold 23px Georgia}.micro,small{font:11px monospace;letter-spacing:1.3px}.switch{margin-left:auto;display:flex;gap:4px;background:#343934;border-radius:8px;padding:4px}.switch button{border:0;background:none;color:#cbd1c7;padding:7px 14px;border-radius:5px}.switch button[aria-pressed=true]{background:#e2edc9;color:#293728}.shell{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 70px)}aside{padding:32px 20px;background:#eeece4;border-right:1px solid #dbd8cd}aside b{display:block;font:25px Georgia;margin-bottom:40px}aside button,.chips button{background:none;border:1px solid #d5d1c5;border-radius:8px;padding:9px 12px}aside button{width:100%;text-align:left;margin:8px 0}main{padding:8vh 6vw 32px;width:100%;max-width:1020px;margin:auto}h1{font:clamp(38px,5vw,70px)/1 Georgia;margin:18px 0;letter-spacing:-.045em}.glyph{font-size:56px;color:#ba6549}.sub{color:#746f64;line-height:1.6}.composer{border:1px solid #cfcabe;border-radius:16px;background:#fffefa;padding:16px;box-shadow:0 6px 24px #352d1709;margin:20px 0 12px}.composer input{width:100%;background:none;border:0;padding:8px 0 24px}.tools{display:flex;align-items:center;justify-content:space-between}.send{background:#ac563e;color:white;border:none;border-radius:8px;padding:8px 15px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{font-size:13px}.log{max-height:34vh;overflow:auto}.msg{line-height:1.5;margin-top:12px;padding:12px 15px;border-left:3px solid #bca98f;background:#eeeae0;white-space:pre-wrap}.msg small{display:block;margin-bottom:4px}footer{margin-top:25px;color:#86877d}.console{background:#111817;color:#c9ded3;font-family:monospace}.console aside{background:#18201f;border-color:#36413c}.console aside b,.console h1{font-family:monospace}.console h1{font-size:clamp(26px,4vw,50px)}.console .glyph,.console .sub{color:#8fc9a2}.console .composer,.console .msg{background:#1b2623;border-color:#455b50;border-radius:4px}.console .send{background:#a7dbb6;color:#163620}.console aside button,.console .chips button{border-color:#43574c;border-radius:3px}.console input::placeholder{color:#94ab9e}@media(max-width:650px){.shell{display:block}aside{display:none}.bar>.micro{display:none}main{padding:8vh 6vw}.bar{gap:4px}} </style><header class="bar"><span class="mark">✳ Sprout</span><span class="micro">INTERFACE STUDIES</span><div class="switch" aria-label="Demo style"><button id="studio">01 Studio</button><button id="console">02 Console</button></div></header><div class="shell"><aside><b id="brand"></b><small id="navtitle"></small><button id="reset"></button><br><br><small>QUICK ACTIONS</small><div id="actions"></div></aside><main><div class="glyph" id="glyph"></div><small id="eyeline"></small><h1 id="title"></h1><p class="sub" id="subtitle"></p><div id="log" class="log" aria-live="polite"></div><form class="composer"><input required maxlength="300" id="prompt" aria-label="Demo prompt" autocomplete="off"><div class="tools"><small id="engine"></small><button class="send" id="send"></button></div></form><div class="chips" id="chips"></div><footer class="micro">INTERACTIVE MOCKUP · SAMPLE RESPONSES ONLY</footer></main></div><script>
const $=id=>document.getElementById(id), designs={studio:{brand:'Sprout Studio',nav:'WORKSPACE',reset:'＋ New conversation',glyph:'✳',eye:'01 / CONVERSATIONAL STUDY',title:'What’s on your mind?',sub:'A quiet space to think, explore ideas, and grow with Sprout.',hint:'Write to Sprout…',engine:'✧  COMPANION MODE',send:'Send ↑',examples:{'Brainstorm with me':'Let’s sketch a tiny project: a field journal for things you notice on daily walks. Would you rather start with a map or a notebook?','Explain memory':'Think of memory as a notebook. A companion can retrieve relevant notes before composing a reply.','Give me a writing prompt':'A gardener discovers a plant that grows only when someone asks it a question. What does the gardener ask first?'}},console:{brand:'sprout / dev',nav:'SESSION',reset:'＋ Clear session',glyph:'>_',eye:'02 / DEVELOPER STUDY',title:'Workspace console',sub:'Inspect a sample project, review a change, or simulate a test run.',hint:'Describe a task or enter a sample command…',engine:'●  SANDBOX SIMULATION',send:'Run ↵',examples:{'List files':'sprout/\n├── index.html   interface\n├── app.js       conversation and memory\n└── server.py    local model bridge','Review a diff':'Sample diff · app.js\n− sendButton.disabled = false;\n+ sendButton.disabled = pending;\n\nReview: prevent duplicate submits during inference.','Run tests':'Simulated test run\n✓ composer accepts input\n✓ memory recalls a saved note\n\n2 illustrative checks · no commands executed'}}};let mode='studio',history={studio:[],console:[]};function draw(){const d=designs[mode];document.body.className=mode==='console'?'console':'';for(const [id,k] of Object.entries({brand:'brand',navtitle:'nav',reset:'reset',glyph:'glyph',eyeline:'eye',title:'title',subtitle:'sub',engine:'engine',send:'send'}))$(id).textContent=d[k];$('prompt').placeholder=d.hint;for(const id of Object.keys(designs))$(id).setAttribute('aria-pressed',id===mode);for(const id of ['actions','chips']){$(id).replaceChildren();for(const key of Object.keys(d.examples)){const b=document.createElement('button');b.textContent=key;b.onclick=()=>reply(key);$(id).append(b)}}$('log').replaceChildren();for(const [who,text] of history[mode]){const box=document.createElement('div'),label=document.createElement('small');box.className='msg';label.textContent=who;box.append(label,document.createTextNode(text));$('log').append(box)}$('log').scrollTop=$('log').scrollHeight}function reply(t){history[mode].push(['YOU',t],['SPROUT / DEMO',designs[mode].examples[t]||'This is a visual demo, not a live model. Try one of the sample actions below.']);draw()}for(const id of Object.keys(designs))$(id).onclick=()=>{mode=id;$('prompt').value='';draw()};$('reset').onclick=()=>{history[mode]=[];draw()};document.querySelector('form').onsubmit=e=>{e.preventDefault();let t=$('prompt').value.trim();if(t)reply(t);$('prompt').value=''};draw();</script></html>
