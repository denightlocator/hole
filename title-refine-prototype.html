  /* current implementation: two gradients meeting at 72% -> visible seam */
  #scrim-a{
    background:
      linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,0)) 0 0/72% 100% no-repeat,
      linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.273)) 72% 0/28% 100% no-repeat;
  }
  /* fixed: one continuous curve, no slope break */
  #scrim-b{
    background:
      linear-gradient(90deg,
        rgba(5,4,9,.92) 0%,
        rgba(5,4,9,.86) 16%,
        rgba(5,4,9,.68) 34%,
        rgba(5,4,9,.42) 52%,
        rgba(5,4,9,.18) 70%,
        rgba(5,4,9,.05) 86%,
        rgba(5,4,9,0) 100%);
  }
  #vig{
    background:
      radial-gradient(125% 95% at 68% 48%, rgba(0,0,0,0) 38%, rgba(0,0,0,.45) 82%, rgba(0,0,0,.72) 100%),
      linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 12%, rgba(0,0,0,0) 80%, rgba(0,0,0,.62) 100%);
  }
  #grain{
    opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }
  #bloom{
    mix-blend-mode:screen;opacity:.55;
    background:radial-gradient(46% 34% at 71% 49%, rgba(255,196,120,.30), rgba(255,150,70,.12) 45%, rgba(255,140,60,0) 72%);
  }
  #glowWord{
    mix-blend-mode:screen;
    background:radial-gradient(42% 34% at 13% 24%,
      color-mix(in srgb, var(--accent) 16%, transparent) 0%,
      color-mix(in srgb, var(--accent) 7%, transparent) 34%,
      transparent 78%);
    opacity:.75;
  }

  /* ---------- shared text ---------- */
  .wordmark{
    position:absolute;
    font-weight:800;letter-spacing:.02em;
    color:#fff;line-height:1;
  }
  .tagline{
    position:absolute;color:rgba(255,255,255,.42);
    font-weight:600;
  }
  .hairline{position:absolute;height:calc(var(--u)*1.5);border-radius:2px}

  /* ---------- variant A: as shipped ---------- */
  #content{position:absolute;inset:0}
  .a-btn{
    position:absolute;
    display:flex;align-items:center;
    padding-left:calc(var(--u)*4);
    font-size:calc(var(--u)*7.4);
    color:#e9e9ef;
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.13);
    border-radius:calc(var(--u)*2);
    text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .a-btn.accent{
    border-color:var(--accent);
    background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 26%, transparent), color-mix(in srgb,var(--accent) 12%, transparent));
  }

  /* ---------- variant B: glass rail ---------- */
  .rail{
    position:absolute;
    border-radius:calc(var(--u)*13);
    background:linear-gradient(160deg, rgba(24,20,34,.62), rgba(9,8,14,.72));
    border:1px solid rgba(255,255,255,.075);
    box-shadow:0 calc(var(--u)*14) calc(var(--u)*40) rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(14px) saturate(120%);
  }
  .rail::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 70% at 0% 0%, color-mix(in srgb,var(--accent) 12%, transparent), transparent 62%);
  }
  .b-row{
    position:absolute;display:flex;align-items:center;
    padding-left:calc(var(--u)*11);padding-right:calc(var(--u)*8);
    border-radius:calc(var(--u)*8);
    font-size:calc(var(--u)*7.6);font-weight:600;
    color:rgba(235,233,243,.82);
    border:1px solid transparent;
    letter-spacing:.01em;
  }
  .b-row .tick{
    position:absolute;left:calc(var(--u)*4.5);top:50%;
    width:calc(var(--u)*1.6);height:calc(var(--u)*9);
    transform:translateY(-50%) scaleY(0);
    border-radius:2px;background:var(--accent);
    transition:transform .16s ease;
  }
  .b-row .chev{
    position:absolute;right:calc(var(--u)*8);opacity:0;
    color:var(--accent);font-size:calc(var(--u)*8);transition:opacity .16s ease
  }
  .b-row:hover, .b-row.sel{
    color:#fff;
    background:linear-gradient(90deg, color-mix(in srgb,var(--accent) 17%, transparent), rgba(255,255,255,.035));
    border-color:color-mix(in srgb,var(--accent) 34%, transparent);
  }
  .b-row:hover .tick, .b-row.sel .tick{transform:translateY(-50%) scaleY(1)}
  .b-row:hover .chev, .b-row.sel .chev{opacity:.9}
  .b-sep{position:absolute;height:1px;background:linear-gradient(90deg, rgba(255,255,255,.09), rgba(255,255,255,0))}

  /* ---------- variant C: editorial ---------- */
  .c-rule{position:absolute;width:calc(var(--u)*1.2);border-radius:2px;
    background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 85%, transparent), color-mix(in srgb,var(--accent) 10%, transparent));
    opacity:.75}
  .c-row{
    position:absolute;display:flex;align-items:center;justify-content:space-between;
    font-size:calc(var(--u)*8);font-weight:600;letter-spacing:.11em;
    color:rgba(236,234,244,.66);
    padding-bottom:calc(var(--u)*5);
  }
  .c-row .grid{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(255,255,255,.075)}
  .c-row .fill{position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--accent);transition:width .2s ease}
  .c-row .chev{opacity:0;color:var(--accent);font-size:calc(var(--u)*9);transition:opacity .18s,transform .18s;transform:translateX(calc(var(--u)*-3))}
  .c-row:hover{color:#fff}
  .c-row:hover .fill{width:100%}
  .c-row:hover .chev{opacity:1;transform:translateX(0)}
  .c-row.sel{color:#fff}
  .c-row.sel .fill{width:38%}
  .c-row.sel .chev{opacity:.85;transform:translateX(0)}

  /* ---------- control panel ---------- */
  #panel{
    position:fixed;right:18px;bottom:18px;width:268px;z-index:50;
    background:rgba(14,12,20,.88);border:1px solid rgba(255,255,255,.09);
    border-radius:14px;padding:14px;backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(0,0,0,.6);
    font-size:12px;
  }
  #panel h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8b879c;margin-bottom:7px;font-weight:700}
  .seg{display:flex;gap:6px;margin-bottom:14px}
  .seg button{
    flex:1;padding:8px 0;border-radius:9px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    color:#cfcbdd;font-size:12px;font-weight:600;transition:.15s;
  }
  .seg button.on{background:rgba(181,123,255,.22);border-color:rgba(181,123,255,.6);color:#fff}
  .swatches{display:flex;gap:9px;margin-bottom:14px}
  .sw{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid transparent;position:relative}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;color:#a9a4bb}
  input[type=range]{-webkit-appearance:none;width:118px;height:4px;border-radius:3px;background:rgba(255,255,255,.14);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;cursor:pointer}
  .chk{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#a9a4bb;cursor:pointer;user-select:none}
  .chk input{accent-color:#b57bff;width:14px;height:14px}
  #hint{position:fixed;left:18px;bottom:18px;color:#6f6b80;font-size:11px;letter-spacing:.04em}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="layer" id="bg"></div>
    <div class="layer" id="scrim-a"></div>
    <div class="layer" id="scrim-b"></div>
    <div class="layer" id="vig"></div>
    <div class="layer" id="bloom"></div>
    <div class="layer" id="grain"></div>
    <div class="layer" id="glowWord"></div>
    <div id="content"></div>
  </div>
</div>

<div id="panel">
  <h4>Layout</h4>
  <div class="seg" id="variants">
    <button data-v="a">A &middot; shipped</button>
    <button data-v="b">B &middot; glass</button>
    <button data-v="c">C &middot; editorial</button>
  </div>
  <h4>Accent</h4>
  <div class="swatches" id="accents"></div>
  <h4>Wordmark</h4>
  <div class="row"><span>height</span><input type="range" id="wy" min="15" max="32" value="21"></div>
  <div class="chk"><input type="checkbox" id="cBloom" checked><label for="cBloom">warm bloom over the disk</label></div>
  <div class="chk"><input type="checkbox" id="cGrain"><label for="cGrain">film grain</label></div>
  <div class="chk"><input type="checkbox" id="cSeam"><label for="cSeam">seam fix (A only)</label></div>
</div>
<div id="hint">hover the menu items &middot; drag the slider</div>

<script>
const stage = document.getElementById('stage');
const content = document.getElementById('content');
const W = 1568, H = 819;

let variant = 'b';
let accent = '#E8A23C';
let wy = 21;
let seamFix = false;

/* scale the 1568x819 stage to fit the window */
function fit(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.96;
  document.getElementById('wrap').style.transform = 'scale(' + s + ')';
  stage.style.setProperty('--u', (W / 960) + 'px');   // 1 logical px
}
window.addEventListener('resize', fit);

const ACCENTS = [
  ['#B57BFF','violet (current)'],
  ['#E8A23C','amber &mdash; matches the disk'],
  ['#FF7A3D','ember'],
  ['#7FD8FF','ice']
];

function buildSwatches(){
  const box = document.getElementById('accents');
  ACCENTS.forEach(([hex], i) => {
    const d = document.createElement('div');
    d.className = 'sw' + (i === 1 ? ' on' : '');
    d.style.background = hex;
    d.title = ACCENTS[i][1];
    d.onclick = () => {
      accent = hex;
      [...box.children].forEach(c => c.classList.remove('on'));
      d.classList.add('on');
      render();
    };
    box.appendChild(d);
  });
}

/* ---------- renderers ---------- */
function render(){
  stage.style.setProperty('--accent', accent);
  stage.style.setProperty('--wy', wy);
  document.getElementById('scrim-a').style.display = (variant === 'a') ? 'block' : 'none';
  document.getElementById('scrim-b').style.display = (variant === 'a' && !seamFix) ? 'none' : 'block';
  document.getElementById('glowWord').style.display = (variant === 'a') ? 'none' : 'block';
  if (variant === 'a') renderA(); else if (variant === 'b') renderB(); else renderC();
}

function wordmarkBlock(yPct, sizeU, label, tag, opt){
  const x = 0.06 * W;
  const y = yPct / 100 * H;
  const fs = sizeU * (W / 960);
  let out = '';
  out += '<div class="wordmark" style="left:' + x + 'px;top:' + y + 'px;font-size:' + fs + 'px;'
       + (opt && opt.glow ? 'text-shadow:0 0 ' + (fs*0.9) + 'px color-mix(in srgb,' + accent + ' 55%, transparent);' : '')
       + '">' + label + '</div>';
  if (opt && opt.hair){
    out += '<div class="hairline" style="left:' + (x + 2) + 'px;top:' + (y + fs*0.98) + 'px;width:' + (fs*1.55) + 'px;'
         + 'background:linear-gradient(90deg,' + accent + ',color-mix(in srgb,' + accent + ' 0%, transparent));"></div>';
  }
  const tagY = y + fs * (opt && opt.hair ? 1.42 : 1.16);
  const tagFs = (opt && opt.tagSize ? opt.tagSize : 6.6) * (W / 960);
  out += '<div class="tagline" style="left:' + (x + (opt && opt.tagIndent ? opt.tagIndent : 2)) + 'px;top:' + tagY + 'px;'
       + 'font-size:' + tagFs + 'px;letter-spacing:' + (tagFs * 0.42) + 'px;">' + tag + '</div>';
  return out;
}

function footer(){
  const y = 0.83 * H, x = 0.06 * W;
  const fs = 6.4 * (W / 960);
  return '<div class="tagline" style="left:' + x + 'px;top:' + y + 'px;font-size:' + fs + 'px;letter-spacing:0;">'
       + 'Orbit 0.1.0 <span style="color:' + accent + ';opacity:.85">&middot;</span> Fabric</div>';
}

/* A: exactly what is on screen now */
function renderA(){
  const u = W / 960;
  const x = 0.06 * W;
  let y = 0.44 * H;
  const bw = 120 * u, bh = 16 * u, gap = 4 * u;
  const items = [['Singleplayer',0],['Multiplayer',1],['Mods',0],['Realms',0]];
  let h = wordmarkBlock(wy, 22, 'ORBIT', 'C L I E N T', {hair:true});
  items.forEach(([label, acc]) => {
    h += '<div class="a-btn' + (acc ? ' accent' : '') + '" style="left:' + x + 'px;top:' + y + 'px;width:'
       + bw + 'px;height:' + bh + 'px;">' + label + '</div>';
    y += bh + gap;
  });
  const by = 0.83 * H - 6 * u;
  h += '<div class="a-btn" style="left:' + x + 'px;top:' + by + 'px;width:' + (57*u) + 'px;height:' + (14*u) + 'px;font-size:' + (7*u) + 'px;">Options</div>';
  h += '<div class="a-btn" style="left:' + (x + 61*u) + 'px;top:' + by + 'px;width:' + (59*u) + 'px;height:' + (14*u) + 'px;font-size:' + (7*u) + 'px;">Quit</div>';
  h += footer();
  content.innerHTML = h;
}

/* B: glass rail - buttons sit in a real panel, accent rides the hovered row */
function renderB(){
  const u = W / 960;
  const x = 0.06 * W;
  const cardW = 172 * u;
  const rowH = 20 * u, gap = 5 * u, pad = 9 * u;
  const rows = [['Singleplayer',0],['Multiplayer',1],['Mods',0],['Realms',0]];
  const cardH = rows.length * rowH + (rows.length - 1) * gap + pad * 2;
  const cardY = 0.44 * H;

  let h = wordmarkBlock(wy, 24, 'ORBIT', 'C L I E N T', {hair:true, glow:true});

  h += '<div class="rail" style="left:' + (x - pad) + 'px;top:' + cardY + 'px;width:' + cardW + 'px;height:' + cardH + 'px;"></div>';

  let ry = cardY + pad;
  rows.forEach(([label, sel], i) => {
    h += '<div class="b-row' + (sel ? ' sel' : '') + '" style="left:' + (x - pad + pad) + 'px;top:' + ry + 'px;width:'
       + (cardW - pad * 2) + 'px;height:' + rowH + 'px;">'
       + '<span class="tick"></span>' + label + '<span class="chev">&rsaquo;</span></div>';
    if (i < rows.length - 1) {
      h += '<div class="b-sep" style="left:' + (x + 2) + 'px;top:' + (ry + rowH + gap/2 - 0.5) + 'px;width:' + (cardW - pad*2 - 8) + 'px;"></div>';
    }
    ry += rowH + gap;
  });

  // options/quit as small ghost chips below the rail
  const fy = cardY + cardH + 7 * u;
  h += '<div class="b-row" style="left:' + (x) + 'px;top:' + fy + 'px;width:' + (72*u) + 'px;height:' + (17*u)
     + 'px;padding-left:' + (8*u) + 'px;font-size:' + (7*u) + 'px;">Options</div>';
  h += '<div class="b-row" style="left:' + (x + 77*u) + 'px;top:' + fy + 'px;width:' + (72*u) + 'px;height:' + (17*u)
     + 'px;padding-left:' + (8*u) + 'px;font-size:' + (7*u) + 'px;">Quit</div>';

  h += footer();
  content.innerHTML = h;
}

/* C: editorial - no boxes at all, rules and type do the work */
function renderC(){
  const u = W / 960;
  const x = 0.06 * W;
  const colW = 148 * u;
  const rowH = 22 * u;
  const rows = [['Singleplayer',0],['Multiplayer',1],['Mods',0],['Realms',0]];
  const top = 0.42 * H;

  let h = wordmarkBlock(wy, 26, 'ORBIT', 'C L I E N T', {hair:false, glow:true, tagIndent:0});

  // vertical rule running down the whole menu
  h += '<div class="c-rule" style="left:' + (x - 9*u) + 'px;top:' + (top - 5*u) + 'px;height:'
     + (rows.length * rowH + 2*u) + 'px;"></div>';

  let ry = top;
  rows.forEach(([label, sel]) => {
    h += '<div class="c-row' + (sel ? ' sel' : '') + '" style="left:' + x + 'px;top:' + ry + 'px;width:' + colW + 'px;">'
       + '<span>' + label.toUpperCase() + '</span><span class="chev">&rsaquo;</span>'
       + '<span class="grid"></span><span class="fill"></span></div>';
    ry += rowH;
  });

  // meta row: Options / Quit
  const fy = top + rows.length * rowH + 7 * u;
  h += '<div class="c-row" style="left:' + x + 'px;top:' + fy + 'px;width:' + colW + 'px;font-size:' + (7*u) + 'px;">'
     + '<span>OPTIONS</span><span class="chev">&rsaquo;</span><span class="grid"></span><span class="fill"></span></div>';
  h += '<div class="c-row" style="left:' + x + 'px;top:' + (fy + 20*u) + 'px;width:' + colW + 'px;font-size:' + (7*u) + 'px;">'
     + '<span>QUIT</span><span class="chev">&rsaquo;</span><span class="grid"></span><span class="fill"></span></div>';

  h += footer();
  content.innerHTML = h;
}

/* ---------- wiring ---------- */
document.querySelectorAll('#variants button').forEach(b => {
  b.onclick = () => {
    variant = b.dataset.v;
    document.querySelectorAll('#variants button').forEach(o => o.classList.toggle('on', o === b));
    render();
  };
});
document.getElementById('wy').oninput = e => { wy = +e.target.value; render(); };
document.getElementById('cBloom').onchange = e => {
  document.getElementById('bloom').style.display = e.target.checked ? 'block' : 'none';
};
document.getElementById('cGrain').onchange = e => {
  document.getElementById('grain').style.display = e.target.checked ? 'block' : 'none';
};
document.getElementById('cSeam').onchange = e => { seamFix = e.target.checked; render(); };

document.querySelector('#variants button[data-v="b"]').classList.add('on');
document.getElementById('grain').style.display = 'none';
buildSwatches();
fit();
render();
</script>
</body>
</html>
