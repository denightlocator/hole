 #scrim{background:linear-gradient(90deg,rgba(3,5,12,.92) 0%,rgba(3,5,12,.86) 18%,rgba(3,5,12,.66) 38%,
   rgba(3,5,12,.38) 56%,rgba(3,5,12,.12) 74%,rgba(3,5,12,.02) 90%,rgba(3,5,12,0) 100%)}
 #vig{background:radial-gradient(125% 95% at 60% 40%,rgba(0,0,0,0) 42%,rgba(0,0,0,.4) 84%,rgba(0,0,0,.66) 100%),
   linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 16%,rgba(0,0,0,0) 80%,rgba(0,0,0,.55) 100%)}
 #twinkle{background:#0B1B3A;opacity:.06;mix-blend-mode:screen;transition:opacity 2s ease}
 .wordmark{position:absolute;font-weight:800;letter-spacing:.02em;color:#fff;line-height:1;
   text-shadow:0 0 26px rgba(140,180,255,.5)}
 .tagline{position:absolute;color:rgba(255,255,255,.48);font-weight:600}
 .rail{position:absolute;border-radius:13px;background:linear-gradient(160deg,rgba(18,22,34,.6),rgba(7,9,15,.74));
   border:1px solid rgba(255,255,255,.075);box-shadow:0 14px 40px rgba(0,0,0,.55),
   inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(14px) saturate(120%)}
 .row{position:absolute;display:flex;align-items:center;border-radius:8px;font-size:12.4px;font-weight:600;
   color:rgba(235,235,243,.82);border:1px solid transparent;transition:.15s}
 .row .tick{position:absolute;left:7px;top:50%;width:3px;height:14px;transform:translateY(-50%) scaleY(0);
   border-radius:2px;background:var(--a);transition:transform .16s}
 .row .chev{position:absolute;right:12px;opacity:0;color:var(--a);font-size:13px;transition:opacity .16s}
 .row:hover,.row.sel{color:#fff;border-color:color-mix(in srgb,var(--a) 36%,transparent);
   background:linear-gradient(90deg,color-mix(in srgb,var(--a) 18%,transparent),rgba(255,255,255,.035))}
 .row:hover .tick,.row.sel .tick{transform:translateY(-50%) scaleY(1)}
 .row:hover .chev,.row.sel .chev{opacity:.9}
 .sep{position:absolute;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.09),rgba(255,255,255,0))}
 #panel{position:fixed;right:18px;bottom:18px;background:rgba(12,14,22,.9);border:1px solid rgba(255,255,255,.09);
   border-radius:13px;padding:13px;font-size:12px;color:#cfcbdd;display:flex;gap:10px;align-items:center}
 .sw{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent}
 .sw.on{border-color:#fff}
</style></head><body>
<div id="wrap"><div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="scrim"></div>
  <div class="layer" id="vig"></div>
  <div class="layer" id="twinkle"></div>
  <div id="c" class="layer"></div>
</div></div>
<div id="panel"><span>accent</span><div id="sw"></div></div>
<script>
const W=1568,H=819,u=W/960,x=0.06*W;
const COLORS=['#7FA8FF','#E8A23C','#B57BFF','#7FD8FF'];
let accent=COLORS[0];
function fit(){document.getElementById('wrap').style.transform='scale('+Math.min(innerWidth/W,innerHeight/H)*0.94+')';}
addEventListener('resize',fit);
const sw=document.getElementById('sw');
COLORS.forEach((c,i)=>{const d=document.createElement('div');d.className='sw'+(i?'':' on');d.style.background=c;
 d.onclick=()=>{accent=c;[...sw.children].forEach(e=>e.classList.remove('on'));d.classList.add('on');render();};sw.appendChild(d);});
function render(){
  document.documentElement.style.setProperty('--a',accent);
  const cardW=172*u,rowH=20*u,gap=5*u,pad=9*u,cardY=0.47*H;
  const rows=[['Singleplayer',0],['Multiplayer',1],['Mods',0],['Realms',0]];
  const cardH=rows.length*rowH+(rows.length-1)*gap+pad*2;
  const wy=0.26*H,fs=24*u;
  let h='<div class="wordmark" style="left:'+x+'px;top:'+wy+'px;font-size:'+fs+'px">ORBIT</div>';
  h+='<div style="position:absolute;left:'+(x+2)+'px;top:'+(wy+fs*0.98)+'px;width:'+(fs*1.55)+'px;height:1.5px;'
   +'background:linear-gradient(90deg,'+accent+',transparent)"></div>';
  h+='<div class="tagline" style="left:'+(x+2)+'px;top:'+(wy+fs*1.42)+'px;font-size:9.9px;letter-spacing:4.2px">CLIENT</div>';
  h+='<div class="rail" style="left:'+(x-pad)+'px;top:'+cardY+'px;width:'+cardW+'px;height:'+cardH+'px"></div>';
  let ry=cardY+pad;
  rows.forEach((r,i)=>{
    h+='<div class="row'+(r[1]?' sel':'')+'" style="left:'+x+'px;top:'+ry+'px;width:'+(cardW-pad*2)+'px;height:'+rowH
     +'px;padding-left:'+(11*u)+'px"><span class="tick"></span>'+r[0]+'<span class="chev">&rsaquo;</span></div>';
    if(i<rows.length-1) h+='<div class="sep" style="left:'+(x+2)+'px;top:'+(ry+rowH+gap/2)+'px;width:'+(cardW-pad*2-8)+'px"></div>';
    ry+=rowH+gap;
  });
  const fy=cardY+cardH+7*u;
  h+='<div class="row" style="left:'+x+'px;top:'+fy+'px;width:'+(72*u)+'px;height:'+(17*u)+'px;padding-left:'+(8*u)+'px;font-size:'+(9.5*u)+'px">Options</div>';
  h+='<div class="row" style="left:'+(x+77*u)+'px;top:'+fy+'px;width:'+(72*u)+'px;height:'+(17*u)+'px;padding-left:'+(8*u)+'px;font-size:'+(9.5*u)+'px">Quit</div>';
  h+='<div class="tagline" style="left:'+x+'px;top:'+(0.86*H)+'px;font-size:9px">Orbit 0.1.0 <span style="color:'+accent+'">&middot;</span> Fabric</div>';
  document.getElementById('c').innerHTML=h;
}
// twinkle: slow breathing, same idea as the in-game translucent pass
let t=0;
setInterval(()=>{t+=.12;document.getElementById('twinkle').style.opacity=(0.045+0.03*Math.sin(t)).toFixed(3);},120);
fit();render();
</script></body></html>
